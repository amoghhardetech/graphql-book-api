server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: book

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:postgresql://localhost:5432/bookdb
    username: postgres
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  graphql:
    graphiql:
      enabled: true
