server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: book

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:postgresql://localhost:5432/bookdb
    username: postgres
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  graphql:
    graphiql:
      enabled: true

  ai:
    mcp:
      server:
        protocol: STATELESS
        name: book
        version: 1.0.0
        instructions: "Use these tools to list, get, create, update, and delete books. Call listBooks before updating or deleting so you have a real id."
        streamable-http:
          mcp-endpoint: /mcp
